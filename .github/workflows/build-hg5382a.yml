name: Build FiberHome HG5382A

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签（留空则只上传 Actions 产物）
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: build-hg5382a
  cancel-in-progress: false

jobs:
  build:
    name: Build airoha/an7581 - fiberhome_hg5382a
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Fix script permissions and line endings
        run: |
          # 仓库最初在 Windows 上创建：补齐可执行位，并清理配置文件里的 Windows 换行
          git ls-files -z | xargs -0 grep -IlZ '^#!' 2>/dev/null | xargs -0 -r chmod +x
          chmod -R +x config scripts
          find . -path ./.git -prune -o -type f -name '*.sh' -exec chmod +x {} +
          # 目标系统内需要可执行的脚本（Windows 导入时丢失了执行位）
          find . -path ./.git -prune -o -type f \( \
            -path '*/etc/init.d/*' -o -path '*/etc/hotplug.d/*' -o \
            -path '*/etc/uci-defaults/*' -o -path '*/etc/board.d/*' -o \
            -path '*/etc/rc.button/*' -o -path '*/etc/rc.local' -o \
            -path '*/etc/ppp/ip-up.d/*' -o -path '*/etc/ppp/ip-down.d/*' -o \
            -path '*/usr/bin/*' -o -path '*/usr/sbin/*' -o -path '*/usr/libexec/*' \
          \) -exec chmod +x {} +
          sed -i 's/\r$//' configs/*.config
          # 自检：关键脚本必须可执行，配置文件不得含 CR
          test -x scripts/feeds
          test -x config/check-uname.sh
          test -x config/check-hostcxx.sh
          ! grep -q $'\r' configs/*.config

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add luci-app-syncdial (BenjaminX)
        run: |
          git clone --depth 1 https://github.com/BenjaminX/luci-app-syncdial.git package/luci-app-syncdial
          rm -rf package/luci-app-syncdial/.git package/luci-app-syncdial/.claude
          test -f package/luci-app-syncdial/Makefile

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure firmware
        run: |
          ./scripts/kconfig.pl + configs/an7581.config + configs/release.config configs/hg5382a.config > .config
          # 只保留 FiberHome HG5382A 的镜像，避免顺带编译其它设备
          sed -i -e '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' \
                 -e '/^CONFIG_TARGET_DEVICE_PACKAGES_airoha_an7581_DEVICE_/d' .config
          echo 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5382a=y' >> .config
          make defconfig
          # 校验设备与插件均已生效
          grep -q '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5382a=y$' .config
          count=$(grep -c '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$' .config || true)
          if [ "$count" != "1" ]; then
            echo 'ERROR: 设备选择异常，期望仅 fiberhome_hg5382a'
            grep '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_' .config || true
            exit 1
          fi
          grep -q '^CONFIG_PACKAGE_luci-app-syncdial=y$' .config || {
            echo 'ERROR: luci-app-syncdial 未被选中，请检查源码是否拉取成功'
            grep -i syncdial .config || true
            exit 1
          }
          grep -q '^CONFIG_PACKAGE_luci-compat=y$' .config || {
            echo 'ERROR: luci-compat 未被选中，syncdial 的 Lua 界面将无法运行'
            exit 1
          }

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-an7581-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-an7581-

      - name: Download sources
        run: make download -j"$(nproc)" || make download -j1 V=s

      - name: Build firmware
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Collect images
        run: |
          mkdir -p output
          find bin/targets/airoha/an7581 -maxdepth 1 -type f -exec cp -v {} output/ \;
          ls -lh output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiberhome_hg5382a-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Create release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" output/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FiberHome HG5382A $RELEASE_TAG" \
            --generate-notes
